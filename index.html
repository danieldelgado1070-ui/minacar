<!doctype html><html lang="es"><head>
<meta charset="utf8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>MIÑACAR · Gestión 360</title>
<style>
  :root{
    --ink:#111820; --ink-2:#1b2530; --muted:#5d6b78; --muted-2:#8695a2;
    --canvas:#eceff2; --surface:#ffffff; --line:#e1e6eb; --line-2:#eef1f4;
    --side:#121a23; --side-2:#1b2632; --side-line:#28333f; --side-mut:#8b9aa8;
    --accent:#0d7d8c; --accent-2:#0a6673; --accent-soft:#e2f1f2;
    --gold:#d6b400; --gold-soft:#f8ecd6; --lime:#d6e021;
    --ok:#1f9d6b; --ok-s:#e2f3ec; --info:#2f73c7; --info-s:#e6eefa;
    --warn:#e0942a; --warn-s:#fbedd7; --res:#7a5af0; --res-s:#ece7fd;
    --sold:#4b5a67; --sold-s:#e9edf0; --danger:#d8503c; --danger-s:#fbe6e2;
    --r:14px; --r-s:10px;
    --shadow:0 1px 2px rgba(16,24,32,.04), 0 4px 16px rgba(16,24,32,.06);
    --shadow-lg:0 12px 40px rgba(16,24,32,.18);
    --sans:"Segoe UI",system-ui,-apple-system,Roboto,Helvetica,Arial,sans-serif;
    --mono:"SFMono-Regular",Consolas,"Segoe UI Mono","Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--canvas);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
  .num{font-variant-numeric:tabular-nums}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  a{color:var(--accent);text-decoration:none}
  ::selection{background:var(--accent-soft)}

  /* shell */
  .app{display:grid;grid-template-columns:238px 1fr;min-height:100vh}
  .side{background:var(--side);color:#dfe6ec;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;border-right:1px solid var(--side-line)}
  .brand{display:flex;align-items:center;gap:11px;padding:18px 18px 16px}
  .brand .logo{width:36px;height:36px;border-radius:8px;background:var(--lime);display:grid;place-items:center;flex:none;box-shadow:0 2px 10px rgba(214,224,33,.35)}
  .brand b{font-size:16px;letter-spacing:1px;color:#fff;display:block;line-height:1.1;font-weight:800}
  .brand b i{color:var(--lime);font-style:normal}
  .brand span{font-size:10.5px;color:var(--side-mut);letter-spacing:.3px}
  .nav{display:flex;flex-direction:column;gap:2px;padding:6px 12px;overflow-y:auto}
  .nav .lbl{font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:#5f7080;padding:13px 10px 5px;font-weight:600}
  .nav button{display:flex;align-items:center;gap:11px;width:100%;padding:9px 11px;border-radius:9px;color:#c3ced7;font-size:13.5px;font-weight:500;text-align:left;transition:background .12s,color .12s}
  .nav button svg{width:18px;height:18px;flex:none;stroke-width:1.7}
  .nav button:hover{background:var(--side-2);color:#fff}
  .nav button.on{background:linear-gradient(90deg,rgba(13,125,140,.28),rgba(13,125,140,.05));color:#fff;box-shadow:inset 2px 0 0 var(--accent)}
  .nav button .n{margin-left:auto;font-size:11px;color:var(--side-mut);font-family:var(--mono)}
  .side-foot{margin-top:auto;padding:14px 16px;border-top:1px solid var(--side-line);display:flex;align-items:center;gap:10px;font-size:12px;color:var(--side-mut)}
  .avatar{width:30px;height:30px;border-radius:50%;background:var(--gold);color:#3a2c07;display:grid;place-items:center;font-weight:700;font-size:12px;flex:none}

  .main{min-width:0;display:flex;flex-direction:column}
  .topbar{position:sticky;top:0;z-index:20;background:rgba(236,239,242,.85);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:13px 26px;display:flex;align-items:center;gap:16px}
  .topbar h1{font-size:19px;margin:0;letter-spacing:-.3px;font-weight:700}
  .topbar .sub{font-size:12.5px;color:var(--muted);margin-top:1px}
  .search{margin-left:auto;position:relative;display:flex;align-items:center}
  .search svg{position:absolute;left:11px;width:16px;height:16px;color:var(--muted-2);stroke-width:1.8}
  .search input{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 12px 9px 34px;font-size:13px;width:230px;font-family:inherit;color:var(--ink);outline:none}
  .search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  .btn{display:inline-flex;align-items:center;gap:7px;background:var(--ink);color:#fff;padding:9px 15px;border-radius:10px;font-size:13px;font-weight:600;transition:transform .1s,background .12s,filter .12s}
  .btn svg{width:16px;height:16px;stroke-width:2}
  .btn:hover{background:var(--ink-2)}.btn:active{transform:translateY(1px)}
  .btn.gold{background:var(--gold);color:#3a2c07}.btn.gold:hover{filter:brightness(1.05)}
  .btn.accent{background:var(--accent)}.btn.accent:hover{background:var(--accent-2)}
  .btn.ghost{background:var(--line-2);color:var(--ink)}.btn.ghost:hover{background:var(--line)}
  .btn.danger{background:var(--danger-s);color:var(--danger)}.btn.danger:hover{filter:brightness(.98)}
  .btn.sm{padding:6px 11px;font-size:12px;border-radius:8px}
  .icn{width:34px;height:34px;padding:0;justify-content:center;border-radius:9px}

  .view{padding:22px 26px 90px;max-width:1280px;width:100%}
  .view[hidden]{display:none}
  .toolbar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:16px}

  /* kpis */
  .kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px}
  .kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:15px 16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
  .kpi .k-top{display:flex;align-items:center;justify-content:space-between;color:var(--muted)}
  .kpi .k-ic{width:30px;height:30px;border-radius:9px;display:grid;place-items:center;background:var(--accent-soft);color:var(--accent)}
  .kpi .k-ic svg{width:17px;height:17px;stroke-width:1.8}
  .kpi .k-lab{font-size:11.5px;color:var(--muted);margin-top:12px}
  .kpi .k-val{font-size:22px;font-weight:700;letter-spacing:-.6px;margin-top:2px;font-family:var(--mono)}
  .kpi .k-val small{font-size:13px;color:var(--muted);font-weight:600}
  .kpi.hl{background:linear-gradient(150deg,#0f4e56,#0d7d8c);border:none;color:#fff}
  .kpi.hl .k-lab,.kpi.hl .k-top{color:#bfe4e8}
  .kpi.hl .k-ic{background:rgba(255,255,255,.16);color:#fff}
  .kpi.hl .k-val{color:#fff}

  .grid2{display:grid;grid-template-columns:1.35fr 1fr;gap:16px;margin-top:18px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow)}
  .card-h{display:flex;align-items:center;justify-content:space-between;padding:15px 18px 12px}
  .card-h h3{margin:0;font-size:14px;font-weight:700;letter-spacing:-.2px}
  .card-h .hint{font-size:11.5px;color:var(--muted-2)}
  .card-b{padding:6px 18px 18px}

  .barlist{display:flex;flex-direction:column;gap:11px;padding-top:6px}
  .barrow{display:grid;grid-template-columns:130px 1fr 74px;align-items:center;gap:12px}
  .barrow .bl-lab{font-size:12.5px;color:var(--ink);display:flex;align-items:center;gap:8px}
  .dot{width:9px;height:9px;border-radius:50%;flex:none}
  .track{height:9px;background:var(--line-2);border-radius:6px;overflow:hidden}
  .track > i{display:block;height:100%;border-radius:6px}
  .barrow .bl-val{font-size:12.5px;text-align:right;color:var(--muted);font-family:var(--mono);font-weight:600}

  .donut-wrap{display:flex;align-items:center;gap:18px;padding:10px 4px}
  .donut{width:132px;height:132px;flex:none;position:relative}
  .donut .center{position:absolute;inset:0;display:grid;place-content:center;text-align:center}
  .donut .center b{font-size:22px;font-family:var(--mono);letter-spacing:-.5px}
  .donut .center span{font-size:10.5px;color:var(--muted)}
  .legend{display:flex;flex-direction:column;gap:8px;font-size:12.5px}
  .legend div{display:flex;align-items:center;gap:8px}
  .legend b{margin-left:auto;font-family:var(--mono)}

  .chip{padding:7px 13px;border-radius:20px;font-size:12.5px;font-weight:600;background:var(--surface);border:1px solid var(--line);color:var(--muted);transition:.12s}
  .chip:hover{border-color:var(--accent);color:var(--accent)}
  .chip.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .chip .c-n{opacity:.6;margin-left:5px;font-family:var(--mono)}

  /* vehicle cards */
  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
  .vcard{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);overflow:hidden;cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s;text-align:left;width:100%;padding:0}
  .vcard:hover{transform:translateY(-3px);box-shadow:var(--shadow-lg);border-color:#cdd6de}
  .vc-photo{height:118px;position:relative;display:flex;align-items:flex-end;padding:11px;background-size:cover;background-position:center}
  .vc-photo::after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(17,24,32,0) 30%,rgba(17,24,32,.55))}
  .vc-plate{position:relative;z-index:2;font-family:var(--mono);font-weight:700;font-size:12.5px;letter-spacing:1px;background:#f7f8d8;color:#1a1a1a;padding:3px 9px 3px 18px;border-radius:5px;border:1px solid #d9d99a;box-shadow:0 1px 3px rgba(0,0,0,.3)}
  .vc-plate::before{content:"E";position:absolute;left:0;top:0;bottom:0;width:14px;background:#12379e;color:#f7c400;font-size:8px;font-weight:700;display:grid;place-items:center;border-radius:5px 0 0 5px}
  .badge{position:absolute;top:11px;right:11px;z-index:2;font-size:10.5px;font-weight:700;letter-spacing:.3px;padding:4px 9px;border-radius:20px;backdrop-filter:blur(4px)}
  .vc-body{padding:13px 15px 15px}
  .vc-title h4{margin:0;font-size:15px;font-weight:700;letter-spacing:-.2px}
  .vc-meta{font-size:11.5px;color:var(--muted);margin-top:5px;display:flex;gap:12px;flex-wrap:wrap}
  .vc-meta span{display:flex;align-items:center;gap:4px}
  .vc-meta svg{width:13px;height:13px;stroke-width:1.7;color:var(--muted-2)}
  .vc-stats{display:grid;grid-template-columns:1fr 1fr;gap:1px;margin-top:13px;background:var(--line-2);border:1px solid var(--line-2);border-radius:10px;overflow:hidden}
  .vc-stat{background:var(--surface);padding:9px 11px}
  .vc-stat .s-l{font-size:10px;color:var(--muted-2);letter-spacing:.3px;text-transform:uppercase}
  .vc-stat .s-v{font-size:14px;font-weight:700;font-family:var(--mono);margin-top:1px}
  .vc-stat .s-v.pos{color:var(--ok)}.vc-stat .s-v.neg{color:var(--danger)}

  /* table */
  .tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow)}
  table{border-collapse:collapse;width:100%;min-width:640px;font-size:13px}
  thead th{text-align:left;font-size:11px;letter-spacing:.4px;text-transform:uppercase;color:var(--muted);font-weight:600;padding:11px 15px;border-bottom:1px solid var(--line);background:var(--line-2);white-space:nowrap}
  tbody td{padding:11px 15px;border-bottom:1px solid var(--line-2);white-space:nowrap;vertical-align:middle}
  tbody tr:last-child td{border-bottom:none}
  tbody tr:hover{background:#f7f9fb}
  td .plate{font-family:var(--mono);font-weight:700;letter-spacing:.5px}
  .r{text-align:right;font-family:var(--mono)}
  .pill{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:3px 9px;border-radius:20px}
  .pill .dot{width:6px;height:6px}
  .minipill{font-size:10.5px;font-weight:700;padding:2px 8px;border-radius:12px}
  .thumb{width:44px;height:32px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:pointer}
  .warn-ic{color:var(--warn);cursor:help}
  .empty{padding:40px;text-align:center;color:var(--muted);font-size:13px}

  /* drawer 360 */
  .scrim{position:fixed;inset:0;background:rgba(15,22,29,.5);backdrop-filter:blur(2px);z-index:40;opacity:0;transition:opacity .2s;pointer-events:none}
  .scrim.show{opacity:1;pointer-events:auto}
  .drawer{position:fixed;top:0;right:0;height:100vh;width:min(580px,100%);background:var(--canvas);z-index:41;box-shadow:var(--shadow-lg);transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);display:flex;flex-direction:column}
  .drawer.show{transform:none}
  .dr-head{padding:20px 22px;background:var(--surface);border-bottom:1px solid var(--line);position:relative}
  .dr-head .close{position:absolute;top:16px;right:16px;width:32px;height:32px;border-radius:9px;display:grid;place-items:center;color:var(--muted);background:var(--line-2)}
  .dr-head .close:hover{background:var(--line);color:var(--ink)}
  .dr-head .d-plate{font-family:var(--mono);font-weight:700;letter-spacing:1px;font-size:13px;color:var(--accent)}
  .dr-head h2{margin:4px 0 0;font-size:22px;letter-spacing:-.5px}
  .dr-head .d-sub{color:var(--muted);font-size:12.5px;margin-top:4px;display:flex;gap:12px;flex-wrap:wrap}
  .dr-actions{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
  .dr-body{overflow-y:auto;padding:18px 22px 40px;display:flex;flex-direction:column;gap:16px}
  .costbar{display:flex;height:34px;border-radius:9px;overflow:hidden;border:1px solid var(--line)}
  .costbar > div{display:flex;align-items:center;justify-content:center;color:#fff;font-size:11px;font-weight:700;font-family:var(--mono);min-width:0}
  .costlegend{display:grid;grid-template-columns:1fr 1fr;gap:8px 16px;margin-top:12px;font-size:12px}
  .costlegend div{display:flex;align-items:center;gap:7px;color:var(--muted)}
  .costlegend b{margin-left:auto;color:var(--ink);font-family:var(--mono)}
  .costlegend .tot{grid-column:1/-1;border-top:1px solid var(--line);padding-top:9px;color:var(--ink);font-weight:700}
  .tl{display:flex;flex-direction:column;position:relative;padding-left:6px}
  .tl-item{display:grid;grid-template-columns:28px 1fr;gap:12px;padding-bottom:16px;position:relative}
  .tl-item:not(:last-child)::before{content:"";position:absolute;left:13px;top:26px;bottom:-2px;width:2px;background:var(--line)}
  .tl-ic{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;color:#fff;z-index:1}
  .tl-ic svg{width:15px;height:15px;stroke-width:1.9}
  .tl-c{background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:11px 13px;box-shadow:var(--shadow)}
  .tl-c .t-t{display:flex;justify-content:space-between;align-items:baseline;gap:8px}
  .tl-c .t-t b{font-size:13px}
  .tl-c .t-date{font-size:11px;color:var(--muted-2);font-family:var(--mono)}
  .tl-c .t-d{font-size:12px;color:var(--muted);margin-top:3px}
  .tl-c .t-rows{margin-top:8px;display:flex;flex-direction:column;gap:6px}
  .tl-row{display:flex;justify-content:space-between;font-size:12px;padding:6px 9px;background:var(--line-2);border-radius:7px}

  /* forms modal */
  .modal-bg{position:fixed;inset:0;background:rgba(15,22,29,.5);backdrop-filter:blur(2px);display:none;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:38px 16px}
  .modal-bg.open{display:flex}
  .modal{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;width:100%;max-width:660px;box-shadow:var(--shadow-lg)}
  .modal h3{margin:0 0 16px;font-size:17px}
  .row{display:flex;gap:14px;flex-wrap:wrap}
  .field{display:flex;flex-direction:column;gap:5px;margin-bottom:12px;flex:1;min-width:150px}
  .field label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  input,select,textarea{background:#fff;border:1px solid var(--line);color:var(--ink);padding:9px 11px;border-radius:9px;font-size:13.5px;font-family:inherit;outline:none}
  input:focus,select:focus,textarea:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
  textarea{resize:vertical;min-height:44px}
  .modal .actions{display:flex;justify-content:flex-end;gap:10px;margin-top:6px}
  .nif-msg{font-size:12px;margin-top:4px;font-weight:600}
  .nif-msg.ok{color:var(--ok)} .nif-msg.bad{color:var(--danger)}
  .foto-prev{max-width:100%;max-height:200px;border-radius:9px;border:1px solid var(--line);margin-top:6px;display:none}

  .aviso{background:var(--warn-s);border:1px solid #efc987;border-radius:var(--r);padding:14px 18px;margin-bottom:18px}
  .aviso h3{margin:0 0 8px;font-size:14px;color:#a5691a;display:flex;align-items:center;gap:8px}
  .aviso .dias{font-weight:700}
  .lightbox{position:fixed;inset:0;background:rgba(0,0,0,.85);display:none;align-items:center;justify-content:center;z-index:80;padding:24px}
  .lightbox.open{display:flex}
  .lightbox img{max-width:95%;max-height:95%;border-radius:10px}
  .toast{position:fixed;bottom:24px;right:24px;background:var(--ink);color:#fff;padding:12px 18px;border-radius:10px;font-weight:600;opacity:0;transform:translateY(10px);transition:.25s;z-index:99;box-shadow:var(--shadow-lg)}
  .toast.show{opacity:1;transform:translateY(0)}
  .login{position:fixed;inset:0;background:linear-gradient(135deg,#0f1c24,#16262f);display:none;align-items:center;justify-content:center;z-index:100;padding:20px}
  .login.show{display:flex}
  .login .box{background:var(--surface);border-radius:16px;padding:30px 30px 26px;width:340px;box-shadow:var(--shadow-lg)}
  .login .lg{display:flex;align-items:center;gap:11px;margin-bottom:22px}
  .login .sq{width:42px;height:42px;background:var(--lime);border-radius:9px;display:grid;place-items:center}
  .login h2{margin:0;font-size:19px;letter-spacing:1px;font-weight:800}
  .login h2 i{color:#9aa400;font-style:normal}
  .login .box>label{font-size:12px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.4px}
  .login .box input{width:100%;margin:5px 0 14px}
  .login .err{color:var(--danger);font-size:12.5px;margin-bottom:10px;min-height:17px}
  .perms{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:4px}
  .perms label{display:flex;align-items:center;gap:7px;font-size:12.5px;font-weight:500;text-transform:none;letter-spacing:0;color:var(--ink)}
  .perms input{width:auto;margin:0}

  @media(max-width:900px){
    .app{grid-template-columns:1fr}
    .side{position:fixed;bottom:0;top:auto;left:0;right:0;height:auto;flex-direction:row;z-index:50;border-right:none;border-top:1px solid var(--side-line)}
    .brand,.side-foot,.nav .lbl{display:none}
    .nav{flex-direction:row;overflow-x:auto;padding:7px 8px;gap:4px;width:100%}
    .nav button{flex-direction:column;gap:3px;font-size:9.5px;padding:6px 7px;min-width:56px;text-align:center;flex:1}
    .nav button .n{display:none}.nav button span{font-size:9.5px}
    .nav button.on{box-shadow:inset 0 2px 0 var(--accent)}
    .view{padding:16px 14px 92px}.kpis{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}
    .topbar{padding:11px 14px}.search input{width:120px}.topbar h1{font-size:16px}
  }
  @media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style></head><body>

<div class="app">
  <aside class="side">
    <div class="brand">
      <div class="logo"><svg width="24" height="24" viewBox="0 0 44 44"><g fill="none" stroke="#1c1c1c" stroke-width="2.4" stroke-linejoin="round"><path d="M7 37 L16 18 L25 37"/><path d="M14 37 L23 12 L32 37"/><path d="M22 37 L30 22 L38 37"/></g></svg></div>
      <div><b>MIÑA<i>CAR</i></b><span>Gestión 360 · LYRWIRS S.L.</span></div>
    </div>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot"><div class="avatar" id="uAvatar">·</div><div style="flex:1"><div style="color:#cfd8df;font-weight:600" id="uName">—</div><span id="uRol">—</span></div>
      <button class="btn ghost sm" title="Cerrar sesión" onclick="logout()" style="padding:6px 9px">⎋</button></div>
  </aside>

  <div class="main">
    <header class="topbar">
      <div><h1 id="viewTitle">Panel</h1><div class="sub" id="viewSub">Visión general de la operación</div></div>
      <div class="search">

<script>

/* ---------- utilidades ---------- */

const eur2=n=>(n==null||isNaN(n))?"—":Number(n).toLocaleString("es-ES",{style:"currency",currency:"EUR"});
const num=n=>(Number(n)||0).toLocaleString("es-ES");

const fdate=iso=>{if(!iso)return"—";const d=new Date(String(iso).slice(0,10)+"T00:00:00");return isNaN(d)?esc(iso):d.toLocaleDateString("es-ES",{day:"2-digit",month:"short",year:"2-digit"});};

/* ---------- iconos ---------- */
const IC={

  bank:'<path d="M4 10h16M5 10v8M9 10v8M15 10v8M19 10v8M3 20h18M12 3l8 4H4l8-4z" stroke-linejoin="round" stroke-linecap="round"/>',
};
const svg=(p,cls="")=>`<svg class="${cls}" viewBox="0 0 24 24" fill="none" stroke="currentColor">${p}</svg>`;

/* ---------- navegación ---------- */
const NAV=[
  ["panel","Panel",IC.panel,"op"],["stock","Stock",IC.car,"op"],["compras","Compras",IC.cart,"op"],
  ["taller","Taller",IC.wrench,"op"],["logistica","Logística",IC.truck,"op"],["marketing","Marketing",IC.mega,"op"],["agenda","Agenda",IC.book,"op"],
  ["ventas","Ventas",IC.tag,"op"],["tesoreria","Cobros y pagos",IC.euro,"op"],["bancos","Bancos",IC.bank,"op"],["gestoria","Gestoría",IC.stamp,"op"],["garantias","Garantías",IC.shield,"op"],["postventa","Postventa",IC.support,"op"],["documentos","Documentos",IC.folder,"op"],["almacenes","Almacenes",IC.box,"op"],["web","Web",IC.globe,"op"],
  ["clientes","Clientes",IC.users,"dir"],["proveedores","Proveedores",IC.supplier,"dir"],["comerciales","Comerciales",IC.users,"dir"],["transportistas","Transportistas",IC.wheel,"dir"],["gestorias","Gestorías",IC.stamp,"dir"],
  ["itv","ITV",IC.clock,"an"],["informes","Informes",IC.chart,"an"],
  ["usuarios","Usuarios",IC.users,"adm"],
];
const SUB={panel:"Visión general de la operación",stock:"Existencias y ficha 360 de cada vehículo",compras:"Facturas y pagos a proveedor",taller:"Reacondicionamiento y costes de preparación",logistica:"Transporte, entrega y coches pendientes",marketing:"Leads e interesados por vehículo",agenda:"Gestiones diarias de leads y postventa",ventas:"Operaciones cerradas y facturas",tesoreria:"Facturas pendientes de cobro y de pago",bancos:"Extractos bancarios y conciliación de movimientos",gestoria:"Transferencias y exenciones de matriculación",garantias:"Garantías comerciales por vehículo",postventa:"Atenciones tras venta y agenda de reclamaciones",documentos:"Documentación aportada por vehículo",almacenes:"Ubicaciones, valoración del stock y traspasos",web:"Conciliación con minacar.es",clientes:"Directorio de clientes",proveedores:"Directorio de proveedores",comerciales:"Comerciales y cálculo de comisiones",transportistas:"Directorio de transportistas",gestorias:"Directorio de gestorías / asesorías",itv:"Control de ITV por vencimiento y revisiones concertadas",informes:"Rotación y margen por dimensión",usuarios:"Usuarios y permisos de acceso"};
const NEWMAP={stock:"vehiculos",compras:"compras",taller:"taller",ventas:"ventas",logistica:"logistica",marketing:"leads",gestoria:"gestoria",garantias:"garantias",postventa:"postventa",almacenes:"almacenes",clientes:"clientes",proveedores:"proveedores",comerciales:"comerciales",transportistas:"transportistas",gestorias:"gestorias",usuarios:"usuarios"};
const AREA_LABEL=Object.fromEntries(NAV.map(n=>[n[0],n[1]]));
const DOC_TIPOS=["Factura proforma","Factura de compra","Pago al proveedor","Hoja de transporte","Albarán de entrega","Ficha técnica","Permiso de circulación","Facturas de reparación/mantenimiento","Garantía comercial","Factura de venta","Justificante de cobro"];
let current="panel", query="", stockFilter="Todos", panelAlmacen="";
let stockVista="cards", stockSort={campo:"_dias",dir:-1};
function ordenarStock(campo){if(stockSort.campo===campo)stockSort.dir*=-1;else stockSort={campo,dir:1};render();}

let CURRENTUSER=null;
// Qué área controla la escritura de cada tabla/módulo (frontend, espejo del backend)
const TAREA={vehiculos:"stock",compras:"compras",ventas:"ventas",cobros:"ventas",logistica:"logistica",traspasos:"logistica",taller:"taller",leads:"marketing",gestoria:"gestoria",garantias:"garantias",postventa:"postventa",almacenes:"almacenes",clientes:"clientes",proveedores:"proveedores",comerciales:"comerciales",transportistas:"transportistas",extractos:"bancos",movimientos:"bancos",recepciones:"logistica",gestorias:"gestoria"};
function nivel(area){ // "w" | "r" | null
  if(!CURRENTUSER)return null;
  if(CURRENTUSER.rol==="admin")return "w";
  const p=CURRENTUSER.permisos;
  if(Array.isArray(p))return p.includes(area)?"w":null;      // formato antiguo: acceso = escritura
  if(p&&typeof p==="object")return p[area]||null;
  return null;
}
function puede(area){return nivel(area)!=null;}
function puedeEscribir(area){return nivel(area)==="w";}
function puedeEscribirTabla(table){if(CURRENTUSER&&CURRENTUSER.rol==="admin")return true;const a=TAREA[table];if(!a)return true;return puedeEscribir(a);}
function bloqueadoRO(table){if(puedeEscribirTabla(table))return false;toast("🔒 Solo lectura en este módulo");return true;}
const navEl=$("#nav");
function navBtn([id,lab,ic]){return `<button data-v="${id}">${svg(ic)}<span>${lab}</span><span class="n" id="nav-n-${id}"></span></button>`;}
function buildNav(){
  const grp=(lbl,tipo)=>{const its=NAV.filter(n=>n[3]===tipo&&(n[0]==="usuarios"?CURRENTUSER.rol==="admin":puede(n[0])));return its.length?`<div class="lbl">${lbl}</div>`+its.map(navBtn).join(""):"";};
  navEl.innerHTML=grp("Operación","op")+grp("Directorio","dir")+grp("Análisis","an")+grp("Administración","adm");
}
navEl.addEventListener("click",e=>{const b=e.target.closest("button");if(b)go(b.dataset.v);});
$("#newBtn").addEventListener("click",()=>{if(current==="usuarios")return openUserForm();const t=NEWMAP[current]||"vehiculos";openForm(t);});
$("#expBtn").addEventListener("click",exportCurrentView);
$("#impBtn").addEventListener("click",abrirImportar);
function descargarInforme(){const a=document.createElement("a");a.href="/api/informe.xlsx";a.download="informe_minacar.xlsx";document.body.appendChild(a);a.click();a.remove();toast("Descargando informe Excel (varias hojas)…");}
$("#q").addEventListener("input",e=>{query=e.target.value;render();});

function go(v){
  if(CURRENTUSER){ if(v==="usuarios"){if(CURRENTUSER.rol!=="admin")return;} else if(!puede(v))return; }
  current=v;query="";$("#q").value="";
  document.querySelectorAll("#nav button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $("#viewTitle").textContent=NAV.find(n=>n[0]===v)[1];
  $("#viewSub").textContent=SUB[v];
  $("#newBtn").style.display=(NEWMAP[v]&&puedeEscribirTabla(NEWMAP[v]))?"inline-flex":"none";
  const it=IMPORT_VIEWS[v];
  $("#impBtn").style.display=(it&&puedeEscribirTabla(it))?"inline-flex":"none";
  render();
}
// Vistas que admiten importación desde Excel/CSV → tabla destino
const IMPORT_VIEWS={clientes:"clientes",proveedores:"proveedores",transportistas:"transportistas",gestorias:"gestorias",comerciales:"comerciales",stock:"vehiculos"};

/* ---------- datos ---------- */
let DATA={vehiculos:[],clientes:[],transportistas:[],proveedores:[],comerciales:[],compras:[],ventas:[],logistica:[],taller:[],leads:[],gestoria:[],documentos:[],almacenes:[],traspasos:[],garantias:[],postventa:[],agenda:[],cobros:[],seguimientos:[],extractos:[],movimientos:[],recepciones:[],gestorias:[]};
let listasCache={marca:[],ciudad:[],ubicacion:[]}, modelosActuales=[];
async function loadAll(){
  const [veh,cli,tra,prv,com,ven,log,tal,led,ges,doc,alm,tsp,gar,pos,age,cob,cme,seg,ext,mov,rec,gst]=await Promise.all([
    api("/api/vehiculos"),api("/api/clientes"),api("/api/transportistas"),api("/api/proveedores"),
    api("/api/compras"),api("/api/ventas"),api("/api/logistica"),
    api("/api/taller"),api("/api/leads"),api("/api/gestoria"),api("/api/documentos"),
    api("/api/almacenes"),api("/api/traspasos"),
    api("/api/garantias"),api("/api/postventa"),api("/api/agenda"),api("/api/cobros"),api("/api/comerciales"),api("/api/seguimientos"),api("/api/extractos"),api("/api/movimientos"),api("/api/recepciones"),api("/api/gestorias")]);
  DATA={vehiculos:veh,clientes:cli,transportistas:tra,proveedores:prv,compras:com,ventas:ven,logistica:log,taller:tal,leads:led,gestoria:ges,documentos:doc,almacenes:alm,traspasos:tsp,garantias:gar,postventa:pos,agenda:age,cobros:cob,comerciales:cme,seguimientos:seg,extractos:ext,movimientos:mov,recepciones:rec,gestorias:gst||[],usuarios:[]};
  if(CURRENTUSER&&CURRENTUSER.rol==="admin"){try{DATA.usuarios=await api("/api/usuarios")||[];}catch(e){}}
  await cargarListas();
  enrich();
  updateNavCounts();
}
async function setField(table,id,field,value){
  if(bloqueadoRO(table))return;
  const d={};d[field]=value===""?null:value;
  await api(`/api/${table}/${id}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify(d)});
  await loadAll();render();
}
async function cargarListas(){
  listasCache.marca=await api("/api/listas?tipo=marca");
  listasCache.ciudad=await api("/api/listas?tipo=ciudad");
  listasCache.ubicacion=await api("/api/listas?tipo=ubicacion");
}
function enrich(){
  DATA.vehiculos.forEach(v=>{
    v._compra=DATA.compras.filter(c=>c.vehiculo_id===v.id).slice(-1)[0]||null;
    v._venta=DATA.ventas.filter(s=>s.vehiculo_id===v.id).slice(-1)[0]||null;
    v._logs=DATA.logistica.filter(l=>l.vehiculo_id===v.id);
    v._log=v._logs.slice(-1)[0]||null;
    v._taller=DATA.taller.filter(t=>t.vehiculo_id===v.id);
    v._leads=DATA.leads.filter(l=>l.vehiculo_id===v.id);
    v._gestoria=DATA.gestoria.filter(g=>g.vehiculo_id===v.id);
    v._traspasos=DATA.traspasos.filter(t=>t.vehiculo_id===v.id);
    v._recepcion=DATA.recepciones.filter(r=>r.vehiculo_id===v.id).slice(-1)[0]||null;
    v._garantias=DATA.garantias.filter(g=>g.vehiculo_id===v.id);
    v._postventa=DATA.postventa.filter(p=>p.vehiculo_id===v.id);
    v._postCoste=v._postventa.reduce((s,p)=>s+(Number(p.coste)||0),0);
    v._agenda=DATA.agenda.filter(a=>a.vehiculo_id===v.id);
    v._docs=DATA.documentos.filter(d=>d.vehiculo_id===v.id&&!d.agenda_id);
    v._docTipos=new Set(v._docs.map(d=>d.tipo));
    v._docN=DOC_TIPOS.filter(t=>v._docTipos.has(t)).length;
    v._cobros=v._venta?DATA.cobros.filter(c=>c.venta_id===v._venta.id):[];
    v._cobrado=v._cobros.reduce((s,c)=>s+(Number(c.importe)||0),0);
    const base=v._compra?Number(v._compra.precio)||0:0;
    const gastos=v._compra?Number(v._compra.gastos)||0:0;
    v._reacond=v._taller.reduce((s,t)=>s+(Number(t.coste)||0),0);
    v._transporte=v._logs.reduce((s,l)=>s+(Number(l.coste)||0),0);
    v._base=base; v._gastos=gastos;
    v._coste=base+gastos+v._reacond+v._transporte;
    v._cruz=v._venta?((Number(v._venta.cruz_fin)||0)+(Number(v._venta.cruz_seg)||0)+(Number(v._venta.cruz_gar)||0)):0;
    v._margen=v._venta?(Number(v._venta.precio)||0)-v._coste:null;
    v._resultado=v._venta?v._margen+v._cruz:null;
    const entrega=(v._log&&v._log.estado==="Entregado"&&v._log.fecha_entrega)?v._log.fecha_entrega:(v._compra?v._compra.fecha:v.creado);
    const fin=v._venta?v._venta.fecha:todayISO();
    v._dias=entrega?Math.max(0,daysBetween(entrega,fin)):null;
  });
}
function updateNavCounts(){
  const c={stock:DATA.vehiculos.filter(v=>v.estado==="disponible").length,compras:DATA.compras.length,
    taller:DATA.taller.length,ventas:DATA.ventas.length,logistica:DATA.logistica.length,
    marketing:DATA.leads.filter(l=>!["Ganado","Perdido"].includes(l.estado)).length,
    gestoria:DATA.gestoria.filter(g=>!["Aceptada AEAT","Completada","Denegada"].includes(g.estado)).length,
    garantias:DATA.garantias.length,postventa:DATA.postventa.length,
    clientes:DATA.clientes.length,proveedores:DATA.proveedores.length,comerciales:DATA.comerciales.length,transportistas:DATA.transportistas.length};
  for(const k in c){const el=$("#nav-n-"+k);if(el)el.textContent=c[k]||"";}
}
async function reloadAll(){await loadAll();render();}

/* ---------- helpers UI ---------- */
function estInfo(e){return ESTADO[e]||{lab:e||"",c:"var(--muted)",s:"var(--line-2)"};}
function estadoPill(e){const c=estInfo(e);return `<span class="pill" style="background:${c.s};color:${c.c}"><span class="dot" style="background:${c.c}"></span>${c.lab}</span>`;}
function badge(e){const c=estInfo(e);return `<span class="badge" style="background:${c.s};color:${c.c}">${c.lab}</span>`;}
function photoBg(v){if(v.foto)return `background-image:url('${v.foto}')`;const h=COLORHEX[v.color]||"#8a929b";return `background-image:linear-gradient(135deg,${h}33,${h}66),linear-gradient(135deg,#2b3644,#3d4b5c)`;}
function nifIcon(ok){return ok===false?'<span class="warn-ic" title="NIF/DNI/CIF con dígito de control incorrecto">⚠️</span>':"";}
function estadoDot(c,t){return `<span style="display:inline-flex;align-items:center;gap:6px"><span class="dot" style="width:7px;height:7px;background:${c}"></span>${esc(t)}</span>`;}
function itvCell(v){
  if(v.itv_pasada==="No")return '<span style="color:var(--danger);font-weight:600">Sin pasar</span>';
  if(!v.itv_expira)return '<span style="color:var(--muted-2)">—</span>';
  const d=v.itv_expira?daysBetween(todayISO(),v.itv_expira):null;
  let col="var(--ink)",ex="";
  if(d!=null&&d<0){col="var(--danger)";ex=" (caducada)";}else if(d!=null&&d<=15){col="var(--warn)";ex=` (${d} d)`;}
  return `<span style="color:${col}">${fdate(v.itv_expira)}${ex}</span>`;
}
function webCell(v){
  const r=v.ref_web;if(!r)return '<span style="color:var(--muted-2)">—</span>';
  const isUrl=/^https?:\/\//i.test(r.trim());
  const ref=(r.match(/(\d{4,})(?!.*\d)/)||[])[1]||(isUrl?"Ver":r);
  return isUrl?`<a href="${esc(r.trim())}" target="_blank" rel="noopener" onclick="event.stopPropagation()">🌐 ${esc(ref)}</a>`:`<span>${esc(r)}</span>`;
}
function matchQ(v,fields){if(!query)return true;const q=query.toLowerCase();return fields.map(f=>f==null?"":String(f)).join(" ").toLowerCase().includes(q);}

  if(current==="panel")views.innerHTML=viewPanel();
  else if(current==="stock")views.innerHTML=viewStock();
  else if(current==="compras")views.innerHTML=viewCompras();
  else if(current==="taller")views.innerHTML=viewTaller();
  else if(current==="marketing")views.innerHTML=viewMarketing();
  else if(current==="agenda")views.innerHTML=viewAgenda();
  else if(current==="ventas")views.innerHTML=viewVentas();

  else if(current==="bancos")views.innerHTML=viewBancos();
  else if(current==="usuarios")views.innerHTML=viewUsuarios();
  else if(current==="gestoria")views.innerHTML=viewGestoria();
  else if(current==="garantias")views.innerHTML=viewGarantias();
  else if(current==="postventa")views.innerHTML=viewPostventa();
  else if(current==="documentos")views.innerHTML=viewDocumentos();
  else if(current==="almacenes")views.innerHTML=viewAlmacenes();
  else if(current==="proveedores")views.innerHTML=viewProveedores();

function bindRows(){
  views.querySelectorAll("[data-veh]").forEach(el=>el.addEventListener("click",ev=>{
    const t=ev.target.closest("button,a,select");
    if(t&&t!==el)return;               // clic en un botón/enlace INTERNO: no abrir la ficha
    openDrawer(Number(el.dataset.veh));
  }));
  views.querySelectorAll("[data-chip]").forEach(el=>el.addEventListener("click",()=>{stockFilter=el.dataset.chip;render();}));
}
function tableWrap(cols,rows){return `<div class="tbl-wrap"><table><thead><tr>${cols.map(c=>`<th${c.r?' style="text-align:right"':''}>${typeof c==="string"?c:(c.t||"")}</th>`).join("")}</tr></thead><tbody>${rows||`<tr><td colspan="${cols.length}" class="empty">Sin registros.</td></tr>`}</tbody></table></div>`;}

/* ---------- PANEL ---------- */
function viewPanel(){
  const V=DATA.vehiculos;
  const stock=V.filter(v=>v.estado==="disponible"&&(!panelAlmacen||String(v.almacen_id)===panelAlmacen));
  const vendidos=V.filter(v=>v.estado==="vendido"&&v._venta);
  const filtro=`<div class="toolbar" style="margin-bottom:16px"><span style="font-size:12.5px;color:var(--muted)">Almacén:</span>
    <select onchange="panelAlmacen=this.value;render()" style="max-width:220px">
      <option value=""${panelAlmacen===""?" selected":""}>Todos</option>
      ${DATA.almacenes.map(a=>`<option value="${a.id}"${panelAlmacen===String(a.id)?" selected":""}>${esc(a.nombre)}</option>`).join("")}
    </select>${panelAlmacen?`<span style="font-size:12px;color:var(--muted-2)">(las ventas y el margen son globales)</span>`:""}</div>`;
  const valor=stock.reduce((s,v)=>s+v._base,0);
  const diasMed=stock.length?Math.round(stock.reduce((s,v)=>s+(v._dias||0),0)/stock.length):0;
  const margenMed=vendidos.length?Math.round(vendidos.reduce((s,v)=>s+(v._margen||0),0)/vendidos.length):0;
  const mes=todayISO().slice(0,7);
  const ventaMes=DATA.ventas.filter(s=>(s.fecha||"").slice(0,7)===mes).reduce((s,x)=>s+(Number(x.precio)||0),0);
  const margenTot=vendidos.reduce((s,v)=>s+(v._resultado||0),0);
  const itvAvisos=stock.filter(v=>v.itv_expira&&daysBetween(todayISO(),v.itv_expira)<=15).length;

  const kpis=[
    {ic:IC.car,lab:"Vehículos en stock",val:stock.length},
    {ic:IC.euro,lab:"Valoración existencias",val:eur(valor),hl:true},
    {ic:IC.tag,lab:"Margen medio / venta",val:eur(margenMed)},
    {ic:IC.clock,lab:"Días de stock medios",val:diasMed+"<small> d</small>"},
    {ic:IC.chart,lab:"Ventas del mes",val:eur(ventaMes)},
    {ic:IC.euro,lab:"Resultado acumulado",val:eur(margenTot)},
  ];
  // stock por estado
  const byEst={};V.filter(v=>v.estado!=="vendido").forEach(v=>byEst[v.estado]=(byEst[v.estado]||0)+1);
  const estRows=Object.entries(byEst).sort((a,b)=>b[1]-a[1]);const maxEst=Math.max(1,...estRows.map(r=>r[1]));
  // marca
  const byM={};V.forEach(v=>{if(v.marca)byM[v.marca]=(byM[v.marca]||0)+1;});
  const mRows=Object.entries(byM).sort((a,b)=>b[1]-a[1]).slice(0,8);const maxM=Math.max(1,...mRows.map(r=>r[1]));
  // donut combustible
  const byC={};stock.forEach(v=>{const k=v.combustible||"—";byC[k]=(byC[k]||0)+1;});
  const combCol={"Diésel":"#4b5a67","Gasolina":"#0d7d8c","Híbrido":"#1f9d6b","Eléctrico":"#2f73c7","GLP":"#e0942a","GNC":"#7a5af0","—":"#c3ccd3"};
  const cE=Object.entries(byC);const cTot=stock.length;let acc=0;const circ=2*Math.PI*54;
  const segs=cTot?cE.map(([k,n])=>{const fr=n/cTot;const s=`<circle r="54" cx="66" cy="66" fill="none" stroke="${combCol[k]||'#999'}" stroke-width="16" stroke-dasharray="${fr*circ} ${circ}" stroke-dashoffset="${-acc*circ}" transform="rotate(-90 66 66)"/>`;acc+=fr;return s;}).join(""):"";
  // rentabilidad (vendidos por margen)
  const rent=[...vendidos].sort((a,b)=>(b._margen||0)-(a._margen||0)).slice(0,6);
  const maxR=Math.max(1,...rent.map(v=>Math.abs(v._margen||0)));

  const itvBox=itvAvisos?`<div class="aviso"><h3>⚠️ ${itvAvisos} vehículo(s) en stock con la ITV a punto de caducar (15 días)</h3>
    <div style="font-size:12.5px;color:#8a6a2a">Revísalos en <b>Stock</b> · columna ITV. </div></div>`:"";

  return filtro+itvBox+`<div class="kpis">${kpis.map(k=>`<div class="kpi${k.hl?' hl':''}">
      <div class="k-top"><span></span><div class="k-ic">${svg(k.ic)}</div></div>
      <div class="k-lab">${k.lab}</div><div class="k-val">${k.val}</div></div>`).join("")}</div>

    <div class="grid2">
      <div class="card"><div class="card-h"><h3>Stock por estado</h3><span class="hint">${V.filter(v=>v.estado!=="vendido").length} activos</span></div>
        <div class="card-b"><div class="barlist">${estRows.length?estRows.map(([e,n])=>{const c=estInfo(e);return `<div class="barrow"><div class="bl-lab"><span class="dot" style="background:${c.c}"></span>${c.lab}</div><div class="track"><i style="width:${n/maxEst*100}%;background:${c.c}"></i></div><div class="bl-val">${n}</div></div>`;}).join(""):'<div class="empty">Sin vehículos.</div>'}</div></div></div>
      <div class="card"><div class="card-h"><h3>Mix de combustible</h3><span class="hint">en stock</span></div>
        <div class="card-b"><div class="donut-wrap"><div class="donut"><svg viewBox="0 0 132 132" width="132" height="132"><circle r="54" cx="66" cy="66" fill="none" stroke="var(--line-2)" stroke-width="16"/>${segs}</svg><div class="center"><b>${cTot}</b><span>en stock</span></div></div>
          <div class="legend">${cE.length?cE.map(([k,n])=>`<div><span class="dot" style="background:${combCol[k]||'#999'}"></span>${esc(k)}<b>${n}</b></div>`).join(""):'<span style="color:var(--muted)">Sin datos</span>'}</div></div></div></div>
    </div>

    <div class="grid2">
      <div class="card"><div class="card-h"><h3>Rentabilidad por venta</h3><span class="hint">margen real</span></div>
        <div class="card-b"><div class="barlist">${rent.length?rent.map(v=>{const pos=(v._margen||0)>=0;return `<div class="barrow" style="grid-template-columns:150px 1fr 74px"><div class="bl-lab"><span class="dot" style="background:${pos?'var(--ok)':'var(--danger)'}"></span>${esc(v.marca)} ${esc(v.modelo)}</div><div class="track"><i style="width:${Math.abs(v._margen||0)/maxR*100}%;background:${pos?'var(--ok)':'var(--danger)'}"></i></div><div class="bl-val" style="color:${pos?'var(--ok)':'var(--danger)'}">${eur(v._margen)}</div></div>`;}).join(""):'<div class="empty">Aún no hay ventas cerradas.</div>'}</div></div></div>
      <div class="card"><div class="card-h"><h3>Vehículos por marca</h3><span class="hint">aprovisionamiento</span></div>
        <div class="card-b"><div class="barlist">${mRows.length?mRows.map(([m,n])=>`<div class="barrow"><div class="bl-lab">${esc(m)}</div><div class="track"><i style="width:${n/maxM*100}%;background:linear-gradient(90deg,var(--accent),#12a6b8)"></i></div><div class="bl-val">${n}</div></div>`).join(""):'<div class="empty">Sin datos.</div>'}</div></div></div>
    </div>`;
}

/* ---------- STOCK (cards) ---------- */
function viewStock(){
  const V=DATA.vehiculos;
  const counts={Todos:V.length};V.forEach(v=>{const l=estInfo(v.estado).lab;counts[l]=(counts[l]||0)+1;});
  const chipsList=["Todos","Pendiente","En stock","Reservado","Vendido"];
  const chips=chipsList.map(e=>`<button class="chip${stockFilter===e?' on':''}" data-chip="${e}">${e}${counts[e]?`<span class="c-n">${counts[e]}</span>`:""}</button>`).join("");
  let list=V.filter(v=>stockFilter==="Todos"||estInfo(v.estado).lab===stockFilter)
            .filter(v=>matchQ(v,[v.matricula,v.marca,v.modelo,v.color,v.combustible,v.ref_web]));
  list.sort((a,b)=>{let x=a[stockSort.campo],y=b[stockSort.campo];
    if(typeof x==="string"||typeof y==="string"){x=(x||"").toString().toLowerCase();y=(y||"").toString().toLowerCase();return x<y?-stockSort.dir:x>y?stockSort.dir:0;}
    return ((Number(x)||0)-(Number(y)||0))*stockSort.dir;});
  const toggle=`<div style="margin-left:auto;display:flex;gap:4px"><button class="chip${stockVista==='cards'?' on':''}" onclick="stockVista='cards';render()">▦ Tarjetas</button><button class="chip${stockVista==='lista'?' on':''}" onclick="stockVista='lista';render()">☰ Lista</button></div>`;
  const toolbar=`<div class="toolbar">${chips}${toggle}</div>`;
  if(!list.length)return toolbar+`<div class="empty">Sin vehículos${stockFilter!=="Todos"?` en “${stockFilter}”`:""}.</div>`;
  if(stockVista==="lista"){
    const th=(lbl,campo,r)=>`<th style="cursor:pointer${r?';text-align:right':''}" onclick="ordenarStock('${campo}')">${lbl}${stockSort.campo===campo?(stockSort.dir>0?' ▲':' ▼'):''}</th>`;
    const rows=list.map(v=>`<tr data-veh="${v.id}" style="cursor:pointer">
      <td><span class="plate">${esc(v.matricula||"")}</span></td><td>${esc(v.marca||"")}</td><td>${esc(v.modelo||"")}</td>
      <td class="r">${v.anio||""}</td><td class="r">${v.km!=null?num(v.km):""}</td><td>${esc(v.combustible||"")}</td>
      <td>${estadoPill(v.estado)}</td><td>${esc(v.almacen_nombre||"")}</td>
      <td class="r"><b>${v._dias!=null?v._dias:""}</b></td><td>${itvCell(v)}</td>
      <td class="r">${eur(v._coste)}</td><td class="r">${eur(v._venta?v._venta.precio:v._base)}</td></tr>`).join("");
    return toolbar+`<div class="tbl-wrap"><table><thead><tr>${th("Matrícula","matricula")}${th("Marca","marca")}${th("Modelo","modelo")}${th("Año","anio",1)}${th("Km","km",1)}${th("Comb.","combustible")}${th("Estado","estado")}${th("Almacén","almacen_nombre")}${th("Días stock","_dias",1)}<th>ITV</th>${th("Coste","_coste",1)}${th("Precio","precio_venta",1)}</tr></thead><tbody>${rows}</tbody></table></div>`;
  }
  const cards=list.map(v=>{
    const pos=(v._margen||0)>=0;
    return `<button class="vcard" data-veh="${v.id}">
      <div class="vc-photo" style="${photoBg(v)}"><span class="vc-plate">${esc(v.matricula||"—")}</span>${badge(v.estado)}</div>
      <div class="vc-body">
        <div class="vc-title"><h4>${esc(v.marca||"")} ${esc(v.modelo||"")}</h4></div>
        <div class="vc-meta">
          <span>${svg(IC.fuel)}${esc(v.combustible||"—")}</span>
          <span>${svg(IC.road)}${v.km!=null?num(v.km)+" km":"—"}</span>
          <span>${svg(IC.pin)}${esc(v.almacen_nombre||v.ubicacion||"—")}</span></div>
        <div class="vc-stats">
          <div class="vc-stat"><div class="s-l">Coste</div><div class="s-v">${eur(v._coste)}</div></div>
          <div class="vc-stat"><div class="s-l">${v._venta?"Precio venta":"Precio compra"}</div><div class="s-v">${eur(v._venta?v._venta.precio:v._base)}</div></div>
          <div class="vc-stat"><div class="s-l">${v._venta?"Margen":"ITV"}</div>${v._venta?`<div class="s-v ${pos?'pos':'neg'}">${eur(v._margen)}</div>`:`<div class="s-v" style="font-size:12px">${itvCell(v)}</div>`}</div>
          <div class="vc-stat"><div class="s-l">Días stock</div><div class="s-v">${v._dias!=null?v._dias+" d":"—"}</div></div>
        </div></div></button>`;}).join("");
  return toolbar+`<div class="cards">${cards}</div>`;
}

/* ---------- LOGÍSTICA ---------- */
function viewLogistica(){
  const tag=e=>{const m={"Pendiente":["var(--sold-s)","var(--sold)"],"Recogido":["var(--warn-s)","var(--warn)"],"En tránsito":["var(--info-s)","var(--info)"],"Entregado":["var(--ok-s)","var(--ok)"]}[e]||["var(--line-2)","var(--muted)"];return `<span class="minipill" style="background:${m[0]};color:${m[1]}">${esc(e||"Pendiente")}</span>`;};
  const rows=DATA.logistica.filter(l=>matchQ(l,[l.matricula,l.marca,l.modelo,l.transportista_nombre,l.origen,l.destino,l.destinatario,l.estado])).map(l=>{
    const v=DATA.vehiculos.find(x=>x.id===l.vehiculo_id);
    const ini=(v&&v._compra&&v._compra.fecha)?v._compra.fecha:l.fecha_recogida;
    const fin=l.fecha_entrega||todayISO();
    const dias=ini?daysBetween(ini,fin):null;
    const entregado=l.estado==="Entregado";
    const diasTxt=dias==null?"—":`<b style="color:${!entregado&&dias>15?'var(--warn)':'var(--ink)'}">${dias} d</b>${entregado?"":' <span style="color:var(--muted-2);font-size:11px">en curso</span>'}`;
    return `<tr data-veh="${l.vehiculo_id||''}">
      <td>${tag(l.estado)}</td>
      <td><span class="plate">${esc(l.matricula||"")}</span> ${esc(l.marca||"")} ${esc(l.modelo||"")}</td>
      <td>${esc(l.transportista_nombre||"")}</td><td>${esc(l.origen||"")}</td><td>${esc(l.destino||"")}</td>
      <td>${esc(l.destinatario||"")}</td><td>${fdate(l.fecha_recogida)}</td><td>${fdate(l.fecha_entrega)}</td>
      <td class="r">${diasTxt}</td>
      <td class="r"><button class="btn ghost sm" onclick="openForm('logistica',${l.id})">✎</button> <button class="btn danger sm" onclick="delRow('logistica',${l.id})">🗑</button></td>
    </tr>`;}).join("");
  // SIN TRANSPORTE ASIGNADO: comprados, sin recepcionar y sin ninguna fila de transporte
  const sinAsig=DATA.vehiculos.filter(v=>v._compra&&!v.recepcionado&&v.estado!=="vendido"
      &&!DATA.logistica.some(l=>l.vehiculo_id===v.id)
      &&matchQ(v,[v.matricula,v.marca,v.modelo]));
  const sinRows=sinAsig.map(v=>{
    const dias=v._compra&&v._compra.fecha?daysBetween(v._compra.fecha,todayISO()):null;
    return `<tr data-veh="${v.id}">
      <td><span class="minipill" style="background:var(--danger-s);color:var(--danger)">Sin transporte asignado</span></td>
      <td><span class="plate">${esc(v.matricula||"")}</span> ${esc(v.marca||"")} ${esc(v.modelo||"")}</td>
      <td colspan="4" style="color:var(--muted)">Comprado a ${esc(v._compra.proveedor||"—")} · sin transporte ni recepción</td>
      <td>${fdate(v._compra.fecha)}</td><td>—</td>
      <td class="r">${dias!=null?`<b style="color:${dias>15?'var(--danger)':'var(--ink)'}">${dias} d</b>`:"—"}</td>
      <td class="r"><button class="btn accent sm" onclick="openForm('logistica',null,{vehiculo_id:${v.id}})">➕ Asignar transporte</button></td>
    </tr>`;}).join("");
  // Pendientes de RECIBIR (comprados, aún no en stock)
  const recibir=DATA.vehiculos.filter(v=>v.estado==="pendiente"&&matchQ(v,[v.matricula,v.marca,v.modelo]));
  const recRows=recibir.map(v=>`<tr><td><span class="plate">${esc(v.matricula||"")}</span> ${esc(v.marca||"")} ${esc(v.modelo||"")}</td>

    <td class="r"><button class="btn accent sm" onclick="abrirRecepcion(${v.id})">📥 Registrar recepción</button></td></tr>`).join("");
  // Pendientes de ENTREGAR al cliente (vendidos, no entregados)
  const entregar=DATA.ventas.filter(s=>s.entregado!=="Sí"&&matchQ(s,[s.matricula,s.marca,s.modelo,s.cliente]));
  const entRows=entregar.map(s=>`<tr><td><span class="plate">${esc(s.matricula||"")}</span> ${esc(s.marca||"")} ${esc(s.modelo||"")}</td>

  return `<div class="grid2" style="margin-top:0;margin-bottom:18px">
      <div class="card"><div class="card-h"><h3>⬇ Pendientes de recibir (${recibir.length})</h3><span class="hint">comprados, no en stock</span></div>
        <div class="card-b" style="padding:0 18px 12px">${tableWrap([{t:"Vehículo"},{t:"Proveedor"},{t:"F. compra"},{t:"",r:1}],recRows)}</div></div>
      <div class="card"><div class="card-h"><h3>⬆ Pendientes de entregar (${entregar.length})</h3><span class="hint">vendidos, no entregados</span></div>
        <div class="card-b" style="padding:0 18px 12px">${tableWrap([{t:"Vehículo"},{t:"Cliente"},{t:"F. venta"},{t:"",r:1}],entRows)}</div></div>
    </div>
    <div class="card"><div class="card-h"><h3>Transportes</h3><span class="hint">${sinAsig.length?`⚠ ${sinAsig.length} coche(s) comprados sin transporte asignado · `:""}días = desde la compra hasta la entrega</span></div><div class="card-b" style="padding:0 18px 12px">${tableWrap([{t:"Estado"},{t:"Vehículo"},{t:"Transportista"},{t:"Origen"},{t:"Destino"},{t:"Destinatario"},{t:"Recogida"},{t:"Entrega"},{t:"Días",r:1},{t:"",r:1}],sinRows+rows)}</div></div>`;
}

let recMarcas=[];

  recMarcas=[];currentForm={table:"__recepcion",id:vid};

      <div style="text-align:center;margin:6px 0"><button type="button" class="btn ghost sm" onclick="recDiagClear()">Borrar marcas</button> <span id="rc-nmarcas" style="font-size:12px;color:var(--muted)"></span></div>
      <div class="field"><label>Descripción de los desperfectos</label><textarea id="rc-desptxt" rows="3" placeholder="Ej.: arañazo puerta delantera derecha; golpe en paragolpes trasero…"></textarea></div>
    </div>
    <div class="field"><label>Notas de la recepción (opcional)</label><textarea id="rc-notas" rows="2"></textarea></div>`;

function onRecDesp(){$("#rc-desp-box").style.display=$("#rc-desp").checked?"block":"none";}
function recDiagClick(ev){
  if(ev.target.classList&&ev.target.classList.contains("rc-mark"))return;
  const box=$("#rc-diagram"),r=box.getBoundingClientRect();
  recMarcas.push({x:+((ev.clientX-r.left)/r.width*100).toFixed(1),y:+((ev.clientY-r.top)/r.height*100).toFixed(1)});
  recDiagRender();
}
function recDiagRender(){
  const box=$("#rc-diagram");box.querySelectorAll(".rc-mark").forEach(e=>e.remove());
  recMarcas.forEach((m,i)=>{const s=document.createElement("div");s.className="rc-mark";s.textContent="✕";
    s.style.cssText=`position:absolute;left:${m.x}%;top:${m.y}%;transform:translate(-50%,-50%);color:#d8503c;font-weight:900;font-size:20px;cursor:pointer;text-shadow:0 0 3px #fff,0 0 3px #fff`;
    s.onclick=function(e){e.stopPropagation();recMarcas.splice(i,1);recDiagRender();};box.appendChild(s);});
  $("#rc-nmarcas").textContent=recMarcas.length?(recMarcas.length+" marca(s)"):"";
}
function recDiagClear(){recMarcas=[];recDiagRender();}
async function onRecAlm(sel){
  if(sel.value!=="__new__")return;
  const nombre=(prompt("Nombre del nuevo almacén:","")||"").trim();
  if(!nombre){sel.value="";return;}
  const res=await api("/api/almacenes",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({nombre})});
  if(res&&res.id){await loadAll();
    const opts=DATA.almacenes.map(a=>`<option value="${a.id}">${esc(a.nombre)}</option>`).join("");
    sel.innerHTML=`<option value="">— sin asignar —</option>${opts}<option value="__new__">➕ Nuevo almacén…</option>`;
    sel.value=res.id;toast("Almacén creado ✔");
  }else{sel.value="";toast("⚠ No se pudo crear el almacén");}
}
async function guardarRecepcion(){
  const vid=currentForm.id,tiene=$("#rc-desp").checked,alm=$("#rc-alm").value;
  const payload={vehiculo_id:vid,fecha:$("#rc-fecha").value||todayISO(),responsable:$("#rc-resp").value.trim(),
    almacen_id:alm&&alm!=="__new__"?Number(alm):null,ubicacion:$("#rc-ubi").value.trim(),
    tiene_desperfectos:tiene?1:0,desperfectos:tiene?$("#rc-desptxt").value.trim():"",
    marcas:tiene?JSON.stringify(recMarcas):"",notas:$("#rc-notas").value.trim()};
  let res=await api("/api/recepciones",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  if(res&&res.ok===false&&res.puede_forzar){
    const motivo=(prompt("⚠ "+res.error+"\n\nSi el vehículo NO necesita transporte, escribe el motivo para continuar:")||"").trim();
    if(!motivo){return;}
    payload.forzar=true;payload.notas=(payload.notas?payload.notas+" · ":"")+"Sin transporte: "+motivo;
    res=await api("/api/recepciones",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
  }
  if(res&&res.ok===false){toast("⚠ "+(res.error||"No se pudo registrar la recepción"));return;}
  document.querySelector(".modal .actions button.accent").setAttribute("onclick","saveForm()");
  closeModal();toast("Recepción registrada ✔ · coche en stock");await reloadAll();
}
async function marcarEntregado(sid){await api(`/api/ventas/${sid}`,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({entregado:"Sí",fecha_entrega_cli:todayISO()})});toast("Marcado como entregado ✔");await reloadAll();}

function leadsFiltrados(){
  const mc=miComercial();
  return DATA.leads.filter(l=>{
    if(mc&&String(l.comercial_id||"")!==mc)return false;
    if(mktF.comercial&&String(l.comercial_id||"")!==mktF.comercial)return false;
    if(mktF.canal&&(l.canal||"")!==mktF.canal)return false;

/* ---------- DOCUMENTOS (overview) ---------- */
function viewDocumentos(){
  const V=DATA.vehiculos.filter(v=>matchQ(v,[v.matricula,v.marca,v.modelo]));
  const rows=V.map(v=>{const n=v._docN,pct=Math.round(n/DOC_TIPOS.length*100);

      <td style="white-space:normal;color:var(--muted);font-size:12px">${faltan.length?"Faltan: "+faltan.map(esc).join(", "):'<span style="color:var(--ok);font-weight:600">Completo ✓</span>'}</td>

/* ---------- TESORERÍA (cobros y pagos) ---------- */
function cobradoDe(vehId){const v=DATA.vehiculos.find(x=>x.id===vehId);return v?(v._cobrado||0):0;}
function viewTesoreria(){
  // ---- IVA del mes en curso ----
  const mes=todayISO().slice(0,7);
  const inMes=f=>(f||"").slice(0,7)===mes;
  let repTot=0,repCob=0,repNoCob=0;
  DATA.ventas.filter(s=>inMes(s.fecha)).forEach(s=>{
    const precio=Number(s.precio)||0;
    let iva;
    if(s.regimen==="REBU"){const coste=Number(s.coste)||0;iva=Math.max(0,precio-coste)*0.21/1.21;}
    else iva=precio*0.21/1.21;
    repTot+=iva;
    const pend=precio-cobradoDe(s.vehiculo_id);
    if(pend<=0.01)repCob+=iva; else repNoCob+=iva;
  });
  let sopTot=0,sopPag=0,sopNoPag=0;
  const addSop=(iva,pag)=>{sopTot+=iva;if(pag)sopPag+=iva;else sopNoPag+=iva;};
  const pctDe=(x,reb)=>{if(reb&&x.regimen==="REBU")return 0;return (x.iva_pct!=null&&x.iva_pct!=="")?Number(x.iva_pct):21;};
  DATA.compras.filter(c=>inMes(c.fecha)).forEach(c=>{const total=(Number(c.precio)||0)+(Number(c.gastos)||0);const pct=pctDe(c,true);addSop(pct>0?total*pct/(100+pct):0,c.pagado==="Sí");});
  DATA.taller.filter(t=>inMes(t.fecha)).forEach(t=>{const pct=pctDe(t,false);addSop((Number(t.coste)||0)*pct/(100+pct),t.pago==="Pagado");});
  DATA.postventa.filter(p=>inMes(p.fecha)).forEach(p=>{const pct=pctDe(p,false);addSop((Number(p.coste)||0)*pct/(100+pct),p.pago==="Pagado");});
  const liquidar=repTot-sopTot;
  const ivaCard=`<div class="card" style="margin-bottom:18px"><div class="card-h"><h3>IVA del mes en curso (${esc(mes)})</h3><span class="hint">IVA devengado · se distingue cobrado/pagado</span></div>
    <div class="card-b">
      <div class="kpis" style="grid-template-columns:repeat(3,1fr);margin-bottom:10px">
        <div class="kpi"><div class="k-lab">IVA repercutido (ventas)</div><div class="k-val">${eur2(repTot)}</div></div>
        <div class="kpi"><div class="k-lab">IVA soportado (compras/taller/postv.)</div><div class="k-val">${eur2(sopTot)}</div></div>
        <div class="kpi hl"><div class="k-lab">${liquidar>=0?"IVA a ingresar":"IVA a compensar"}</div><div class="k-val">${eur2(Math.abs(liquidar))}</div></div>
      </div>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:7px 24px;font-size:12.5px;color:var(--muted)">
        <div>Repercutido cobrado: <b style="color:var(--ok)">${eur2(repCob)}</b></div>
        <div>Soportado pagado: <b style="color:var(--ink)">${eur2(sopPag)}</b></div>
        <div>Repercutido pendiente de cobro: <b style="color:var(--warn)">${eur2(repNoCob)}</b></div>
        <div>Soportado pendiente de pago: <b style="color:var(--warn)">${eur2(sopNoPag)}</b></div>
      </div>
      <div style="font-size:11.5px;color:var(--muted-2);margin-top:8px">Estimación: importes con IVA incluido al % indicado en cada factura (por defecto 21%; compras REBU sin IVA deducible). Revisa con tu asesoría.</div>
    </div></div>`;
  // COBROS pendientes (ventas)
  const cobros=DATA.ventas.map(s=>{const cob=cobradoDe(s.vehiculo_id);return {s,cob,pend:(Number(s.precio)||0)-cob};})
    .filter(x=>x.pend>0.01).filter(x=>matchQ(x.s,[x.s.matricula,x.s.marca,x.s.modelo,x.s.cliente,x.s.numero_factura]));
  const totCobro=cobros.reduce((a,x)=>a+x.pend,0);
  const cobRows=cobros.map(({s,cob,pend})=>`
    <tr><td>${fdate(s.fecha)}</td><td>${esc(s.numero_factura||"")}</td>
      <td><span class="plate">${esc(s.matricula||"")}</span> ${esc(s.marca||"")} ${esc(s.modelo||"")}</td>
      <td>${esc(s.cliente||"")}</td><td class="r">${eur2(s.precio)}</td><td class="r">${eur2(cob)}</td>
      <td class="r" style="color:var(--danger);font-weight:700">${eur2(pend)}</td>
      <td><input type="date" value="${esc(s.fecha_cobro_est||"")}" onchange="setField('ventas',${s.id},'fecha_cobro_est',this.value)" style="padding:5px 7px"></td></tr>`).join("");
  // PAGOS pendientes (compras + taller + postventa)
  const pagos=[];
  DATA.compras.filter(c=>c.pagado!=="Sí").forEach(c=>pagos.push({fuente:"Compra",tabla:"compras",id:c.id,pf:"pagado",pv:"Sí",concepto:`${esc(c.matricula||"")} ${esc(c.marca||"")} ${esc(c.modelo||"")} · Fra ${esc(c.numero_factura||"—")}`,prov:c.proveedor,imp:(Number(c.precio)||0)+(Number(c.gastos)||0),fest:c.fecha_pago_est}));
  DATA.taller.filter(t=>t.pago!=="Pagado").forEach(t=>pagos.push({fuente:"Taller",tabla:"taller",id:t.id,pf:"pago",pv:"Pagado",concepto:`${esc(t.matricula||"")} · ${esc(t.tipo||"")} ${esc(t.descripcion||"")}`,prov:t.proveedor,imp:Number(t.coste)||0,fest:t.fecha_pago_est}));
  DATA.postventa.filter(p=>p.pago!=="Pagado").forEach(p=>pagos.push({fuente:"Postventa",tabla:"postventa",id:p.id,pf:"pago",pv:"Pagado",concepto:`${esc(p.matricula||"")} · ${esc(p.tipo||"")} ${esc(p.descripcion||"")}`,prov:p.proveedor,imp:Number(p.coste)||0,fest:p.fecha_pago_est}));
  DATA.logistica.filter(l=>l.factura_recibida==="Sí"&&l.pagado!=="Sí"&&(Number(l.coste)||0)>0).forEach(l=>pagos.push({fuente:"Transporte",tabla:"logistica",id:l.id,pf:"pagado",pv:"Sí",concepto:`${esc(l.matricula||"")} ${esc(l.marca||"")} ${esc(l.modelo||"")} · Fra ${esc(l.numero_factura||"—")}`,prov:l.transportista_nombre,imp:Number(l.coste)||0,fest:l.fecha_factura}));
  const pagosF=pagos.filter(p=>matchQ({x:p.concepto+" "+(p.prov||"")},["x",p.concepto,p.prov]));
  const totPago=pagosF.reduce((a,p)=>a+p.imp,0);
  const pagRows=pagosF.map(p=>`
    <tr><td><span class="minipill" style="background:var(--line-2);color:var(--muted)">${p.fuente}</span></td>
      <td>${p.concepto}</td><td>${esc(p.prov||"")}</td>
      <td class="r" style="color:var(--danger);font-weight:700">${eur2(p.imp)}</td>
      <td><input type="date" value="${esc(p.fest||"")}" onchange="setField('${p.tabla}',${p.id},'fecha_pago_est',this.value)" style="padding:5px 7px"></td>
      <td class="r"><button class="btn accent sm" onclick="setField('${p.tabla}',${p.id},'${p.pf}','${p.pv}')">💳 Registrar pago</button></td></tr>`).join("");
  const kpi=(l,v,c)=>`<div class="kpi"><div class="k-lab">${l}</div><div class="k-val" style="color:${c}">${v}</div></div>`;
  return ivaCard+`<div class="kpis" style="grid-template-columns:repeat(2,1fr);margin-bottom:18px">${kpi("Pendiente de cobro",eur(totCobro),"var(--ok)")}${kpi("Pendiente de pago",eur(totPago),"var(--danger)")}</div>
    <div class="card" style="margin-bottom:18px"><div class="card-h"><h3>Facturas pendientes de cobro (${cobros.length})</h3><span class="hint">venta − justificantes de cobro</span></div>
      <div class="card-b" style="padding:0 18px 12px">${tableWrap([{t:"Fecha"},{t:"Nº factura"},{t:"Vehículo"},{t:"Cliente"},{t:"Total",r:1},{t:"Cobrado",r:1},{t:"Pendiente",r:1},{t:"Fecha est. cobro"}],cobRows)}</div></div>
    <div class="card"><div class="card-h"><h3>Facturas pendientes de pago (${pagosF.length})</h3><span class="hint">compras, taller y postventa sin pagar</span></div>
      <div class="card-b" style="padding:0 18px 12px">${tableWrap([{t:"Origen"},{t:"Concepto"},{t:"Proveedor"},{t:"Importe",r:1},{t:"Fecha est. pago"},{t:"",r:1}],pagRows)}</div></div>`;
}

/* ---------- BANCOS (extractos y conciliación) ---------- */
let bancoExtracto=null;
function subirExtracto(){
  if(bloqueadoRO("extractos"))return;
  const inp=document.createElement("input");inp.type="file";
  inp.accept=".csv,.xlsx,.xls,text/csv,text/plain,application/vnd.ms-excel,application/vnd.openxmlformats-officedocument.spreadsheetml.sheet";
  inp.onchange=()=>{const f=inp.files[0];if(!f)return;
    const cuenta=(prompt("¿De qué cuenta/banco es este extracto? (opcional)","")||"").trim();
    const esExcel=/\.(xlsx|xls)$/i.test(f.name);
    const rd=new FileReader();
    rd.onload=async e=>{
      const payload={nombre_archivo:f.name,cuenta,fecha:todayISO()};
      if(esExcel)payload.archivo_b64=e.target.result; else payload.csv=e.target.result;
      const res=await api("/api/extractos",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
      if(res&&res.ok===false){toast("⚠ "+(res.error||"No se pudo procesar el archivo"));return;}
      toast("Extracto procesado ✔");bancoExtracto=res.id;await loadAll();render();};
    if(esExcel)rd.readAsDataURL(f); else rd.readAsText(f);};
  inp.click();
}
function viewBancos(){
  const puedeW=puedeEscribirTabla("extractos");
  if(bancoExtracto){const e=DATA.extractos.find(x=>x.id===bancoExtracto);if(e)return viewExtracto(e,puedeW);bancoExtracto=null;}
  const up=puedeW?`<button class="btn accent" onclick="subirExtracto()">⬆ Subir extracto (CSV o Excel)</button>`:"";
  const rows=DATA.extractos.map(e=>`<tr style="cursor:pointer" onclick="bancoExtracto=${e.id};render()">
    <td>${fdate(e.fecha)}</td><td><b>${esc(e.cuenta||"")}</b></td><td>${esc(e.nombre_archivo||"")}</td>
    <td class="r">${e.n_mov}</td>
    <td>${e.n_conc<e.n_mov?`<span class="minipill" style="background:var(--warn-s);color:var(--warn)">${e.n_mov-e.n_conc} sin conciliar</span>`:'<span class="minipill" style="background:var(--ok-s);color:var(--ok)">✓ conciliado</span>'}</td>
    <td class="r" onclick="event.stopPropagation()">${puedeW?`<button class="btn danger sm" onclick="delRow('extractos',${e.id})">🗑</button>`:""}</td></tr>`).join("");
  return `<div class="toolbar">${up}<span style="font-size:12px;color:var(--muted);margin-left:auto;max-width:420px">Descarga el extracto del día desde tu banca electrónica en <b>CSV o Excel</b> y súbelo. La app concilia cada movimiento con tus ventas, compras, taller y postventa.</span></div>`
    +(DATA.extractos.length?tableWrap([{t:"Fecha"},{t:"Cuenta"},{t:"Archivo"},{t:"Movs",r:1},{t:"Estado"},{t:"",r:1}],rows):'<div class="empty">Aún no hay extractos. Pulsa «Subir extracto (CSV)».</div>');
}
function viewExtracto(e,puedeW){
  const movs=DATA.movimientos.filter(m=>m.extracto_id===e.id);
  const ing=movs.filter(m=>m.importe>0).reduce((s,m)=>s+(m.importe||0),0);
  const gas=movs.filter(m=>m.importe<0).reduce((s,m)=>s+(m.importe||0),0);
  const pend=movs.filter(m=>!m.conciliado).length;
  const kpi=(l,v,c)=>`<div class="kpi"><div class="k-lab">${l}</div><div class="k-val" style="color:${c||"var(--ink)"}">${v}</div></div>`;
  const rows=movs.map(m=>`<tr>
      <td>${fdate(m.fecha)}</td><td style="max-width:240px;white-space:normal">${esc(m.concepto||"")}</td>
      <td class="r" style="color:${m.importe<0?"var(--danger)":"var(--ok)"};font-weight:600">${eur2(m.importe)}</td>
      <td>${m.conciliado?`<span class="minipill" style="background:var(--ok-s);color:var(--ok)">${esc(m.categoria||"Conciliado")}</span>`:'<span class="minipill" style="background:var(--danger-s);color:var(--danger)">Sin conciliar</span>'}</td>
      <td style="font-size:12px;color:var(--muted);max-width:220px;white-space:normal">${esc(m.observacion_app||"")}</td>
      <td>${puedeW?`<input value="${esc(m.observacion_usuario||"")}" placeholder="¿A qué corresponde?" onchange="anotarMov(${m.id},this.value)" style="padding:5px 7px;width:100%">`:esc(m.observacion_usuario||"")}</td>
    </tr>`).join("");
  return `<div class="toolbar"><button class="btn ghost" onclick="bancoExtracto=null;render()">← Extractos</button><b style="margin-left:8px">${esc(e.cuenta||"Extracto")} · ${fdate(e.fecha)}</b></div>
    <div class="kpis" style="grid-template-columns:repeat(4,1fr);margin-bottom:16px">${kpi("Ingresos",eur(ing),"var(--ok)")}${kpi("Gastos",eur(gas),"var(--danger)")}${kpi("Movimientos",movs.length)}${kpi("Sin conciliar",pend,pend?"var(--warn)":"var(--ok)")}</div>
    ${tableWrap([{t:"Fecha"},{t:"Concepto"},{t:"Importe",r:1},{t:"Conciliación"},{t:"Observación (app)"},{t:"Tu observación / a qué corresponde"}],rows)}
    <div class="card" style="margin-top:16px"><div class="card-b"><label style="font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase">Notas del extracto</label>
      <textarea ${puedeW?"":"disabled"} onchange="setField('extractos',${e.id},'notas',this.value)" style="width:100%;margin-top:6px">${esc(e.notas||"")}</textarea></div></div>`;
}
async function anotarMov(id,val){
  if(bloqueadoRO("movimientos"))return;
  const res=await api("/api/movimientos/"+id,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({observacion_usuario:val,conciliado:val.trim()?1:0})});
  if(res&&res.ok===false){toast("⚠ "+res.error);return;}
  toast("Anotado ✔");await loadAll();render();
}

function vigenciaGar(g){
  if(g.estado==="Anulada")return{txt:"Anulada",c:"var(--danger)"};
  if(!g.fecha_fin)return{txt:g.estado||"—",c:"var(--muted)"};
  const d=daysBetween(todayISO(),g.fecha_fin);
  if(d<0)return{txt:"Caducada",c:"var(--danger)"};
  if(d<=30)return{txt:`Vence en ${d} d`,c:"var(--warn)"};
  return{txt:"Vigente",c:"var(--ok)"};
}

  const kpi=(l,v)=>`<div class="kpi"><div class="k-lab">${l}</div><div class="k-val">${v}</div></div>`;

function adjuntarAgendaDoc(vid,agendaId){
  const tipo=prompt("Tipo de prueba (Informe pericial, Factura taller, Presupuesto, Email, Burofax, Otro):","Informe pericial");

let agendaComercial="",agendaHoy=false;
function agendaFiltrada(){
  const hoy=todayISO(),mc=miComercial();
  let items=itemsAgenda();
  if(mc)items=items.filter(i=>String(i.comercial_id||"")===mc);        // el comercial solo ve las suyas
  if(agendaComercial)items=items.filter(i=>String(i.comercial_id||"")===agendaComercial);
  if(agendaHoy)items=items.filter(i=>i.proxima&&i.proxima<=hoy);       // pendientes de hoy o vencidas
  if(query)items=items.filter(i=>matchQ({x:i.veh+" "+(i.quien||"")+" "+(i.comercial||"")},["x"]));
  items.sort((a,b)=>{const pa=a.proxima||"9999",pb=b.proxima||"9999";return pa.localeCompare(pb);});
  return items;
}
function segsDe(ambito,id){return DATA.seguimientos.filter(s=>s.ambito===ambito&&s.ref_id===id).sort((a,b)=>((a.fecha||"").localeCompare(b.fecha||""))||(a.id-b.id));}
function itemsAgenda(){
  const items=[];
  DATA.leads.filter(l=>!l.cerrado).forEach(l=>{const segs=segsDe("lead",l.id),u=segs[segs.length-1]||null;

  DATA.agenda.filter(a=>!a.cerrado).forEach(a=>{const segs=segsDe("agenda",a.id),u=segs[segs.length-1]||null;
    items.push({ambito:"agenda",id:a.id,tipoLbl:"Postventa",veh:`${esc(a.matricula||"")} ${esc(a.marca||"")} ${esc(a.modelo||"")}`,quien:a.asunto||a.tipo,extra:a.tipo,estado:"",comercial_id:u&&u.comercial_id,comercial:u&&u.comercial,segs,ultima:u,proxima:u?u.proxima_fecha:null});});

let comisionMes=todayISO().slice(0,7);
function comisionesComercial(c,mes){
  const ventas=DATA.ventas.filter(s=>s.comercial_id===c.id).slice().sort((a,b)=>((a.fecha||"").localeCompare(b.fecha||""))||(a.id-b.id));
  const fr=Number(c.franquicia)||0, pct=Number(c.comision_pct)||0;
  let mesN=0,mesImporte=0,mesComision=0,mesComisionables=0;
  ventas.forEach((s,i)=>{
    if((s.fecha||"").slice(0,7)!==mes)return;
    mesN++; mesImporte+=Number(s.precio)||0;
    if(i>=fr){mesComisionables++;mesComision+=(Number(s.precio)||0)*pct/100;}
  });
  return {total:ventas.length,mesN,mesImporte,mesComisionables,mesComision,restan:Math.max(0,fr-ventas.length)};
}

  const mes=comisionMes;

      <td>${esc(c.fecha_incorporacion||"")}</td>

      <td class="r">${Number(c.franquicia)||0}${cc.restan?` <span style="color:var(--muted-2);font-size:11px">(faltan ${cc.restan})</span>`:""}</td>
      <td class="r">${cc.mesN} · ${eur(cc.mesImporte)}</td>
      <td class="r">${cc.mesComisionables}</td>
      <td class="r"><b style="color:var(--ok)">${eur2(cc.mesComision)}</b></td>
      <td class="r"><button class="btn ghost sm" onclick="setField('comerciales',${c.id},'activo',${c.activo?0:1})">${c.activo?"Desactivar":"Activar"}</button> <button class="btn ghost sm" onclick="openForm('comerciales',${c.id})">✎</button> <button class="btn danger sm" onclick="delRow('comerciales',${c.id})">🗑</button></td>
    </tr>`;}).join("");
  return `<div class="toolbar" style="margin-bottom:16px"><span style="font-size:13px;color:var(--muted)">Comisiones del mes:</span>

    +tableWrap([{t:"Comercial"},{t:"Incorporación"},{t:"% Com.",r:1},{t:"Franquicia",r:1},{t:"Ventas del mes",r:1},{t:"Comisionan",r:1},{t:"Comisión",r:1},{t:"",r:1}],rows);
}

/* ---------- ITV (listado por vencimiento) ---------- */
function itvEstado(v){
  const hoy=todayISO(),exp=v.itv_expira||"",prox=v.proxima_revision||"",proxOk=prox&&prox>=hoy;
  if(v.itv_pasada==="No")return proxOk?{lab:"Sin pasar · revisión "+fdate(prox),c:"var(--warn)",s:"var(--warn-s)",o:1}:{lab:"SIN PASAR",c:"var(--danger)",s:"var(--danger-s)",o:0};
  if(exp){
    if(exp<hoy)return proxOk?{lab:"Caducada · revisión "+fdate(prox),c:"var(--warn)",s:"var(--warn-s)",o:1}:{lab:"CADUCADA",c:"var(--danger)",s:"var(--danger-s)",o:0};
    const dias=daysBetween(hoy,exp);
    if(dias<=30)return {lab:"Caduca en "+dias+" d",c:"var(--warn)",s:"var(--warn-s)",o:2};
    return {lab:"Vigente",c:"var(--ok)",s:"var(--ok-s)",o:4};
  }
  return {lab:"Sin datos de ITV",c:"var(--muted)",s:"var(--line-2)",o:3};
}
function viewITV(){
  const arr=DATA.vehiculos.filter(v=>v.estado!=="vendido"&&matchQ(v,[v.matricula,v.marca,v.modelo]));
  const wi=arr.map(v=>({v,e:itvEstado(v)}));
  wi.sort((a,b)=>{if(a.e.o!==b.e.o)return a.e.o-b.e.o;const ax=a.v.itv_expira||"9999-99-99",bx=b.v.itv_expira||"9999-99-99";return ax<bx?-1:ax>bx?1:0;});
  const rows=wi.map(({v,e})=>`<tr data-veh="${v.id}">
    <td><span class="plate">${esc(v.matricula||"")}</span> ${esc(v.marca||"")} ${esc(v.modelo||"")}</td>
    <td>${esc(estInfo(v.estado).lab)}</td>
    <td>${esc(v.itv_pasada||"—")}</td>
    <td>${v.itv_expira?fdate(v.itv_expira):"—"}</td>
    <td><input type="date" value="${esc(v.proxima_revision||"")}" onchange="event.stopPropagation();setField('vehiculos',${v.id},'proxima_revision',this.value)" style="padding:5px 7px"></td>
    <td><span class="minipill" style="background:${e.s};color:${e.c}">${e.lab}</span></td>
  </tr>`).join("");
  const nCad=wi.filter(x=>x.e.o===0).length,nProx=wi.filter(x=>x.e.o===1||x.e.o===2).length;
  const kpi=(l,val,c)=>`<div class="kpi"><div class="k-lab">${l}</div><div class="k-val" style="color:${c}">${val}</div></div>`;
  return `<p style="color:var(--muted);margin:0 0 12px;font-size:13px">Coches ordenados por <b>vencimiento de ITV</b> (los más urgentes arriba). Anota la <b>próxima revisión concertada</b> para saber cuáles ya se están gestionando. No incluye vehículos vendidos.</p>
    <div class="kpis" style="grid-template-columns:repeat(2,1fr);margin-bottom:16px">${kpi("Caducadas / sin pasar",nCad,"var(--danger)")}${kpi("Próximas / en gestión",nProx,"var(--warn)")}</div>`
    +tableWrap([{t:"Vehículo"},{t:"Estado"},{t:"ITV pasada"},{t:"Caduca"},{t:"Próxima revisión concertada"},{t:"Situación"}],rows);
}

/* ---------- INFORMES ---------- */
function viewInformes(){
  const V=DATA.vehiculos;
  const dim=(key,lab)=>{const m={};V.forEach(v=>{const k=key(v)||"—";if(!m[k])m[k]={n:0,mg:0,ns:0};m[k].n++;if(v._venta){m[k].mg+=(v._margen||0);m[k].ns++;}});
    const rows=Object.entries(m).sort((a,b)=>b[1].n-a[1].n);const mx=Math.max(1,...rows.map(r=>r[1].n));
    return `<div class="card"><div class="card-h"><h3>${lab}</h3><span class="hint">nº · margen medio (ventas)</span></div>
      <div class="card-b"><div class="barlist">${rows.map(([k,o])=>`<div class="barrow" style="grid-template-columns:130px 1fr 110px"><div class="bl-lab">${esc(k)}</div><div class="track"><i style="width:${o.n/mx*100}%;background:linear-gradient(90deg,var(--accent),#12a6b8)"></i></div><div class="bl-val">${o.n}${o.ns?" · "+eur(o.mg/o.ns):""}</div></div>`).join("")}</div></div></div>`;};
  return `<div class="toolbar" style="margin-bottom:14px"><span style="font-size:12.5px;color:var(--muted)">Descarga el <b>informe completo</b> en Excel con una hoja por módulo:</span>
      <button class="btn accent" onclick="descargarInforme()">⬇ Informe completo (Excel, todas las hojas)</button></div>
    <p style="color:var(--muted);margin:0 0 16px;font-size:13px">Analiza qué <b>rota y deja más margen</b> para orientar la compra según la demanda. (En cualquier ventana, el botón <b>Excel</b> de arriba exporta esa lista.)</p>
    <div class="grid2">${dim(v=>v.marca,"Por marca")}${dim(v=>v.combustible,"Por combustible")}</div>
    <div class="grid2">${dim(v=>v.color,"Por color")}${dim(v=>estInfo(v.estado).lab,"Por estado")}</div>`;
}

      right=docs.map(d=>`<a href="/doc/${d.id}" target="_blank" class="minipill" style="background:var(--ok-s);color:var(--ok);text-decoration:none" title="${esc(d.nombre_original||"")}">👁 ver</a><button class="btn danger sm" style="padding:2px 6px;margin-left:4px" onclick="quitarDoc(${d.id},${v.id})">✕</button>`).join(" ")
        +` <button class="btn ghost sm" style="padding:2px 8px" onclick="adjuntarDoc(${v.id},'${t}')">+ otro</button>`;
    }else right=`<button class="btn ghost sm" onclick="adjuntarDoc(${v.id},'${t}')">📎 Adjuntar</button>`;
    return `<div class="tl-row" style="align-items:center"><span>${aportada?"✅":"⬜"} ${esc(tipo)}</span><span style="display:flex;align-items:center;gap:2px">${right}</span></div>`;
  }).join("");
  let cobro="";
  const pct=Math.round(v._docN/DOC_TIPOS.length*100);
  return `<div class="card"><div class="card-h"><h3>Documentación (${v._docN}/${DOC_TIPOS.length})</h3><span class="hint">${pct}% aportado</span></div>
    <div class="card-b"><div class="track" style="margin-bottom:12px"><i style="width:${pct}%;background:${pct>=100?"var(--ok)":"var(--accent)"}"></i></div>
    <div style="display:flex;flex-direction:column;gap:6px">${rows}</div>${cobro}</div></div>`;
}
function adjuntarDoc(vid,tipo){
  const inp=document.createElement("input");inp.type="file";inp.accept="image/*,application/pdf";
  inp.onchange=()=>{const file=inp.files[0];if(!file)return;
    if(file.size>20*1024*1024){toast("El archivo supera los 20 MB");return;}
    let importe=null;
    if(tipo==="Justificante de cobro"){const x=prompt("Importe cobrado en este justificante (€):","");if(x===null)return;importe=Number(String(x).replace(",","."))||0;}
    const rd=new FileReader();
    rd.onload=async e=>{const res=await api("/api/documentos",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({vehiculo_id:vid,tipo,filename:file.name,data:e.target.result,importe,fecha:todayISO()})});
      if(res&&res.ok===false){toast("⚠ "+(res.error||"No se pudo subir"));return;}
      toast("Documento aportado ✔");await loadAll();openDrawer(vid);};
    rd.readAsDataURL(file);};
  inp.click();
}

async function saveForm(){
  const {table,id}=currentForm,sc=SCHEMAS[table],data={};
  for(const f of sc.fields){const el=$("#f-"+f.k);if(!el)continue;let v=el.value;
    if(f.t==="number"||f.t==="veh-stock"||f.t==="veh-transporte"||f.t.startsWith("ref-"))v=v===""?null:Number(v);if(v==="__add__"||v==="__new__"||v==="__newcli__")v="";data[f.k]=v;}
  const miss=sc.fields.filter(f=>f.req&&(data[f.k]==null||data[f.k]===""));
  if(miss.length){toast("Falta: "+miss.map(f=>f.l).join(", "));return;}
  if(table==="leads"&&!(String(data.telefono||"").trim())&&!(String(data.email||"").trim())){toast("Indica al menos un email o un teléfono del contacto");return;}
  const url=id?`/api/${table}/${id}`:`/api/${table}`;
  let res=await api(url,{method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  if(res&&res.ok===false&&res.puede_forzar){
    if(!confirm("⚠ "+res.error+"\n\n¿Es una gestión EXCEPCIONAL (p. ej. una reparación durante el transporte) y quieres registrarla igualmente?")){return;}
    data.forzar=true;
    res=await api(url,{method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  }
  if(res&&res.ok===false&&/motivo del cambio/i.test(res.error||"")){
    const m=(prompt("Vas a cambiar el comercial de este lead. Indica el motivo del cambio:")||"").trim();
    if(!m){toast("Cambio cancelado");return;}
    data.motivo_cambio=m;
    res=await api(url,{method:id?"PUT":"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)});
  }
  if(res&&res.ok===false){toast("⚠ "+(res.error||"No se pudo guardar"));return;}
  // Alta desde un desplegable: volver al formulario anterior con la nueva entidad ya seleccionada
  if(formReturn&&!id&&res&&res.id&&table===formReturn.entity){
    const fr=formReturn;formReturn=null;
    await loadAll();
    await volverAlFormulario(fr,res.id);
    toast("Creado y seleccionado ✔");
    return;
  }
  // Lead nuevo: registrar la primera gestión (para que aparezca en la Agenda)
  if(table==="leads"&&!id&&res&&res.id&&(data.gestion_hoy||data.gestion_prox||data.proxima_fecha)){
    await api("/api/seguimientos",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({
      ambito:"lead",ref_id:res.id,fecha:data.fecha||todayISO(),
      contacto:data.gestion_hoy||"Alta del lead",detalle:data.gestion_prox||"",
      proxima_fecha:data.proxima_fecha||null,comercial_id:data.comercial_id||null})});
  }
  closeModal();toast(id?"Actualizado ✔":"Guardado ✔");closeDrawer();await reloadAll();
}

function onFoto(input){const file=input.files[0];if(!file)return;const rd=new FileReader();
  rd.onload=e=>{const img=new Image();img.onload=()=>{const max=1000;let w=img.width,h=img.height;
    if(w>h&&w>max){h=Math.round(h*max/w);w=max;}else if(h>max){w=Math.round(w*max/h);h=max;}
    const cv=document.createElement("canvas");cv.width=w;cv.height=h;cv.getContext("2d").drawImage(img,0,0,w,h);
    const data=cv.toDataURL("image/jpeg",.82);$("#f-foto").value=data;const pv=$("#foto-prev");pv.src=data;pv.style.display="block";};img.src=e.target.result;};
  rd.readAsDataURL(file);}
