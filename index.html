/* ---------- validación NIF ---------- */
function validarNIF(valor){if(!valor)return null;let s=valor.replace(/[\s.\-]/g,"").toUpperCase();if(!s)return null;
  const L="TRWAGMYFPDXBNJZSQVHLCKE";
  if(/^[0-9]{8}[A-Z]$/.test(s))return s[8]===L[parseInt(s.slice(0,8),10)%23];
  if(/^[XYZ][0-9]{7}[A-Z]$/.test(s)){const n=""+"XYZ".indexOf(s[0])+s.slice(1,8);return s[8]===L[parseInt(n,10)%23];}
  if(/^[ABCDEFGHJNPQRSUVW][0-9]{7}[0-9A-Z]$/.test(s)){const d=s.slice(1,8);let par=0,imp=0;
    for(let i=0;i<d.length;i++){let x=parseInt(d[i],10);if(i%2===0){x*=2;imp+=x<10?x:x-9;}else par+=x;}
    const c=(10-(par+imp)%10)%10,letra="JABCDEFGHI"[c],ctrl=s[8];
    if("PQSW".includes(s[0])||/[A-Z]/.test(ctrl))return ctrl===letra;
    if("ABEH".includes(s[0]))return ctrl===String(c);return ctrl===String(c)||ctrl===letra;}
  return false;}
function chkNif(v){const el=$("#nif-msg");if(!el)return;const r=validarNIF(v);
  if(r===null){el.textContent="";el.className="nif-msg";}
  else if(r){el.textContent="✓ NIF/CIF válido";el.className="nif-msg ok";}
  else{el.textContent="✗ Dígito de control incorrecto — revisa el NIF/DNI/CIF";el.className="nif-msg bad";}}

function toCSV(cols,rows){
  const q=s=>{s=(s==null?"":String(s));return /[";\n\r]/.test(s)?'"'+s.replace(/"/g,'""')+'"':s;};
  return "﻿"+[cols.map(q).join(";")].concat(rows.map(r=>r.map(q).join(";"))).join("\r\n");
}

async function descargarXlsx(name,cols,rows){
  try{
    const r=await fetch("/api/tabla.xlsx",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({name,cols,rows})});
    if(!r.ok){toast("⚠ No se pudo exportar");return;}
    const blob=await r.blob(),u=URL.createObjectURL(blob),a=document.createElement("a");
    a.href=u;a.download="minacar_"+name+".xlsx";document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(u),1500);
    toast("Excel exportado ✔ ("+rows.length+" filas)");
  }catch(e){toast("⚠ No se pudo exportar");}
}

async function hacerImportar(inp,table){
  const f=inp.files[0];if(!f)return;
  const esExcel=/\.(xlsx|xls)$/i.test(f.name),rd=new FileReader();
  $("#imp-result").innerHTML='<span style="color:var(--muted)">Procesando…</span>';
  rd.onload=async e=>{
    const payload={table};
    if(esExcel)payload.archivo_b64=e.target.result; else payload.csv=e.target.result;
    const res=await api("/api/importar",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if(res&&res.ok===false){$("#imp-result").innerHTML='<span style="color:var(--danger)">⚠ '+esc(res.error||"No se pudo importar")+'</span>';return;}
    let html=`<div style="color:var(--ok);font-weight:700">✔ Importados ${res.insertados} de ${res.total} registro(s).</div>`;
    if(res.errores&&res.errores.length)html+=`<div style="margin-top:8px;color:var(--danger);font-size:12px">No se importaron ${res.errores.length}:<br>${res.errores.slice(0,15).map(esc).join("<br>")}</div>`;
    $("#imp-result").innerHTML=html;
    await loadAll();render();
  };
  if(esExcel)rd.readAsDataURL(f); else rd.readAsText(f);
}

    <div class="card"><div class="card-h"><h3>Catálogo publicado en la web ${q?`(${total} coinciden)`:`(${total})`}</h3></div><div class="card-b">
      <div class="tbl-wrap"><table><thead><tr><th>Ref.</th><th>Coche</th><th>Actualizado</th><th>Ficha</th><th>En la app</th></tr></thead><tbody>
      ${shown.map(w=>{const nombre=w.marca?`${esc(w.marca)} ${esc(w.modelo)}`:esc(w.titulo);
        const enApp=w.app_matricula?`<span class="minipill" style="background:var(--ok-s);color:var(--ok)">✓ ${esc(w.app_matricula)}</span>`:`<select id="lnk-${w.ref}" style="max-width:200px">${optsVeh}</select> <button class="btn accent sm" onclick="vincularWeb('${esc(w.url)}','${w.ref}')">Vincular</button>`;
        return `<tr><td><b>${esc(w.ref||"")}</b></td><td>${nombre}</td><td>${esc(w.lastmod||"")}</td><td><a href="${esc(w.url)}" target="_blank" rel="noopener">🌐 abrir</a></td><td>${enApp}</td></tr>`;}).join("")}
      </tbody></table></div>${total>LIM?`<div class="empty">Mostrando ${LIM} de ${total}. Usa el buscador para acotar.</div>`:""}
    </div></div>`;
}
async function vincularWeb(url,ref){const sel=$("#lnk-"+ref);const vid=sel?sel.value:"";if(!vid){toast("Elige primero un coche de la app");return;}
  const res=await api("/api/vehiculos/"+vid,{method:"PUT",headers:{"Content-Type":"application/json"},body:JSON.stringify({ref_web:url})});
  if(res&&res.ok===false){toast("⚠ "+(res.error||"No se pudo vincular"));return;}
  toast("Vinculado ✔");await loadAll();await actualizarWeb();}

/* ================= SESIÓN ================= */
async function boot(){
  let me;
  try{ const r=await fetch("/api/me"); me=await r.json(); }catch(e){ me={auth:false}; }
  if(!me.auth){ $("#login").classList.add("show"); setTimeout(()=>$("#lg-user").focus(),100); return; }
  CURRENTUSER=me.user; await iniciarApp();
}
async function login(){
  const u=$("#lg-user").value.trim(), p=$("#lg-pass").value;
  $("#lg-err").textContent="";
  const r=await fetch("/api/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username:u,password:p})});
  const d=await r.json();
  if(!d.ok){ $("#lg-err").textContent=d.error||"No se pudo iniciar sesión"; return; }
  CURRENTUSER=d.user; $("#login").classList.remove("show"); $("#lg-pass").value="";
  await iniciarApp();
}
async function logout(){ try{await fetch("/api/logout",{method:"POST"});}catch(e){} location.reload(); }
async function iniciarApp(){
  buildNav();
  $("#uName").textContent=CURRENTUSER.nombre||CURRENTUSER.username;
  $("#uRol").textContent=CURRENTUSER.rol==="admin"?"Administrador":"Usuario";
  $("#uAvatar").textContent=(CURRENTUSER.nombre||CURRENTUSER.username||"?").trim().slice(0,2).toUpperCase();
  $("#expBtn").style.display="inline-flex";
  await loadAll();
  const first=NAV.map(n=>n[0]).find(a=>a!=="usuarios"&&puede(a))||(CURRENTUSER.rol==="admin"?"panel":null);
  go(first||"panel");
}
boot();
</script>
